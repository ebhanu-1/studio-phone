<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clipper">
<meta name="theme-color" content="#f4f5f7">
<title>Clipper</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNiAyNiI+PHJlY3QgeD0iMSIgeT0iMSIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNi41IiBmaWxsPSIjMjU2M2ViIi8+PGNpcmNsZSBjeD0iMTMiIGN5PSIxMyIgcj0iNi40IiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iMS43IiBmaWxsPSJub25lIi8+PGNpcmNsZSBjeD0iMTMiIGN5PSIxMyIgcj0iMi4xIiBmaWxsPSIjZmZmIi8+PC9zdmc+">
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --line:#e3e6eb; --line2:#d5dae2; --text:#1b2330; --muted:#67717f; --faint:#9aa3b0;
          --accent:#2563eb; --accent-soft:#eaf0fe; --stage:#0f1115; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body { font:15px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; touch-action:manipulation; padding-top:var(--sat);
         position:fixed; inset:0; width:100%; height:100vh; height:100dvh; overflow:hidden; }
  #tip { display:none; margin:0; padding:8px 12px; background:#fffbeb; color:#92400e; font-size:12.5px; border-bottom:1px solid #fde68a; align-items:center; gap:8px; }
  #tip.on { display:flex; } #tip b { font-weight:700; } #tip button { margin-left:auto; border:0; background:transparent; font-weight:700; color:#92400e; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .btn { padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); font-weight:600; font-size:14px; white-space:nowrap; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.ghost { border-color:transparent; background:transparent; }
  .btn.danger { color:#dc2626; border-color:#f1c5c5; }
  .btn:disabled { opacity:.4; }
  /* top */
  #top { height:50px; flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:0 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  #top .brand { display:flex; align-items:center; gap:6px; font-weight:800; font-size:15px; letter-spacing:-.01em; white-space:nowrap; flex:0 0 auto; }
  #top .brand svg { display:block; }
  #top .brand #ver { font-size:10px; font-weight:600; color:var(--faint); margin-left:2px; letter-spacing:.02em; }
  #top .btn { padding:8px 11px; flex:0 0 auto; }
  #name { flex:1 1 40px; min-width:40px; }
  #top .spacer { flex:1; }
  #status { display:none; padding:6px 12px; background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600; border-bottom:1px solid var(--line); }
  #status.on { display:block; }
  #stagelbl { position:absolute; left:8px; top:8px; z-index:3; font-size:11px; font-weight:700; color:#fff; background:rgba(0,0,0,.55); padding:4px 8px; border-radius:7px; pointer-events:none; max-width:70%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* stage */
  #stagewrap { flex:0 0 auto; background:var(--stage); position:relative; display:flex; align-items:center; justify-content:center; touch-action:none; }
  #frame { position:relative; background:#000; overflow:hidden; }
  #frame video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:none; }
  #frame video.on { display:block; }
  #frame #blurbg { position:absolute; inset:-8%; width:116%; height:116%; object-fit:cover; filter:blur(18px) brightness(.8); display:none; }
  #frame #blurbg.on { display:block; }
  #ov { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#9aa3b0; padding:20px; font-size:14px; }
  #empty b { color:#cdd3dc; }
  #empty.off { display:none; }
  #transport { height:40px; flex:0 0 auto; display:flex; align-items:center; gap:4px; padding:0 10px; background:#171a21; color:#d7dbe3; }
  #transport button { background:transparent; border:0; color:#e7eaf0; width:36px; height:36px; border-radius:9px; font-size:16px; }
  #transport #play { background:#fff; color:#111; width:40px; height:36px; }
  #transport .tc { font-variant-numeric:tabular-nums; font-size:13px; color:#c9ced8; margin-left:4px; }
  #transport .tc b { color:#fff; font-weight:600; }
  #transport .spacer { flex:1; }
  /* tools row */
  #tools { flex:0 0 auto; display:flex; align-items:center; gap:5px; padding:5px 8px; background:#eceef2; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #tools .btn { padding:6px 10px; font-size:12.5px; }
  /* timeline */
  #tlwrap { flex:0 0 auto; height:100px; background:#eceef2; position:relative; }
  #trrow { flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:6px 10px; background:#eceef2; border-top:1px solid var(--line); overflow-x:auto; }
  #trrow .lab { font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); white-space:nowrap; }
  #trrow .chip { white-space:nowrap; padding:5px 10px; font-size:12px; }
  #trrow .chips { flex-wrap:nowrap; }
  #tl { position:absolute; inset:0; overflow-x:auto; overflow-y:hidden; padding:12px 12px 0; -webkit-overflow-scrolling:touch; touch-action:pan-x; overscroll-behavior-x:contain; }
  .seg { touch-action:pan-x; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #track { position:relative; height:72px; display:flex; align-items:flex-start; gap:4px; min-width:100%; }
  .seg { position:relative; height:66px; border-radius:9px; overflow:hidden; flex:0 0 auto; border:2px solid transparent; background:#cfd4dc center/auto 100% repeat-x; }
  .seg.card { background:#1b2330; }
  .seg.add { width:64px; background:var(--panel); border:2px dashed var(--line2); display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--accent); cursor:pointer; }
  .seg.card .ct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; padding:6px; text-align:center; }
  .seg.sel { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.35); }
  .seg.lift { opacity:.55; transform:scale(1.04); z-index:5; transition:transform .12s; }
  .seg.dropL { box-shadow:-5px 0 0 var(--accent); } .seg.dropR { box-shadow:5px 0 0 var(--accent); }
  .seg .nm { position:absolute; left:6px; bottom:4px; right:6px; font-size:10.5px; font-weight:600; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.8); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
  .seg .dur { position:absolute; right:5px; top:4px; font-size:10px; font-weight:600; color:#fff; background:rgba(0,0,0,.55); padding:1px 5px; border-radius:4px; pointer-events:none; }
  .seg .bd { position:absolute; left:5px; top:4px; display:flex; gap:3px; pointer-events:none; }
  .seg .bd span { font-size:9.5px; font-weight:700; color:#fff; background:rgba(37,99,235,.9); padding:1px 5px; border-radius:4px; }
  .seg .bd span.m { background:rgba(220,38,38,.9); } .seg .bd span.t { background:rgba(217,119,6,.95); }
  .seg .hnd { position:absolute; top:0; bottom:0; width:26px; display:none; background:rgba(37,99,235,.85); touch-action:none; }
  .seg .hnd::after { content:''; position:absolute; left:10px; top:50%; width:2px; height:18px; margin-top:-9px; background:#fff; border-radius:1px; }
  .seg .hnd.l { left:0; } .seg .hnd.r { right:0; }
  .seg.sel .hnd { display:block; }
  .seg .tm { position:absolute; top:0; height:4px; background:#f59e0b; pointer-events:none; }
  #ph { position:absolute; top:0; bottom:0; width:2px; background:#e11d48; pointer-events:none; z-index:3; }
  #ph::before { content:''; position:absolute; top:0; left:-5px; border:6px solid transparent; border-top:8px solid #e11d48; }
  /* inspector sheet */
  #sheet { flex:1 1 auto; min-height:160px; display:flex; flex-direction:column; background:var(--panel); border-top:1px solid var(--line); }
  #tabs { display:flex; padding:4px 8px 0; border-bottom:1px solid var(--line); flex:0 0 auto; }
  #tabs button { flex:1; padding:10px 6px; border:0; background:transparent; color:var(--muted); font-weight:600; font-size:14px; border-bottom:2px solid transparent; margin-bottom:-1px; }
  #tabs button.active { color:var(--text); border-bottom-color:var(--accent); }
  #panes { flex:1 1 auto; overflow:auto; padding:12px 14px calc(90px + var(--sab)); -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .pane { display:none; } .pane.active { display:block; }
  .sec { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); margin:16px 0 8px; }
  .sec:first-child { margin-top:2px; }
  .row { display:flex; align-items:center; gap:8px; margin:8px 0; }
  .row label { font-size:13px; color:var(--muted); min-width: 84px; }
  .row input[type=text], .row input[type=number], .row select, .row textarea { flex:1; min-width:0; padding:9px 10px; border:1px solid var(--line2); border-radius:9px; background:#fff; font-size:16px; }
  .row input[type=number] { max-width:96px; }
  .row input[type=range] { flex:1; accent-color:var(--accent); height:28px; }
  .row .val { font-size:12px; color:var(--muted); min-width:46px; text-align:right; font-variant-numeric:tabular-nums; }
  .row input[type=color] { width:36px; height:30px; border:1px solid var(--line2); border-radius:7px; padding:1px; background:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; flex:1; }
  .chip { padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--muted); font-size:13px; font-weight:600; }
  .chip.on { background:var(--text); border-color:var(--text); color:#fff; }
  .sw { display:inline-flex; align-items:center; gap:8px; font-size:14px; }
  .sw input { accent-color:var(--accent); width:18px; height:18px; }
  .info { background:#f7f8fa; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--muted); }
  .info b { color:var(--text); }
  .tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em; padding:2px 6px; border-radius:5px; background:#fef3c7; color:#92400e; margin-left:6px; }
  .note { color:var(--faint); font-size:13px; padding:18px 6px; text-align:center; }
  .titem { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; background:#fff; }
  .titem.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .titem .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .titem .m { font-size:12px; color:var(--faint); margin-top:2px; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  /* modal */
  .mbg { position:fixed; inset:0; z-index:400; background:rgba(16,24,40,.38); display:none; align-items:flex-end; justify-content:center; }
  .mbg.open { display:flex; }
  .modal { width:100%; max-height:88vh; overflow:auto; background:#fff; border-radius:18px 18px 0 0; padding:16px 18px calc(24px + var(--sab)); position:relative; }
  .modal .mx { position:absolute; right:12px; top:12px; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:16px; }
  .modal .foot { position:sticky; bottom:0; background:#fff; padding-top:10px; margin-top:12px; }
  .modal h2 { font-size:18px; font-weight:700; margin:0 0 4px; }
  .modal .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:6px; flex:1; }
  .opt { border:1px solid var(--line); border-radius:10px; padding:9px 11px; background:#fff; }
  .opt.sel { border-color:var(--accent); background:var(--accent-soft); }
  .opt b { display:block; font-size:14px; } .opt span { font-size:12px; color:var(--muted); }
  #prog { display:none; margin-top:14px; } #prog.on { display:block; }
  #bar { height:8px; background:#eceef2; border-radius:4px; overflow:hidden; } #bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  #progtxt { margin-top:8px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; }
  .done { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; border-radius:10px; padding:12px 14px; margin-top:12px; font-weight:600; }
  .err { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:10px; padding:12px 14px; margin-top:12px; white-space:pre-wrap; font-size:13px; }
  .foot { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  #toast { position:fixed; left:50%; bottom:calc(90px + var(--sab)); transform:translateX(-50%); z-index:9999; background:#1b2330; color:#fff; padding:10px 16px; border-radius:12px; font-size:13px; font-weight:500; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.on { opacity:1; }
  @media (min-width: 900px) { body { flex-direction:row; flex-wrap:wrap; } #top { width:100%; } #stagewrap, #transport, #tools, #tlwrap { width:62%; } #sheet { width:38%; border-left:1px solid var(--line); height:calc(100vh - 50px); } }
</style>
</head>
<body>
<div id="top">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 26 26" fill="none"><rect x="1" y="1" width="24" height="24" rx="6.5" fill="#2563eb"/><circle cx="13" cy="13" r="6.4" stroke="#fff" stroke-width="1.7"/><circle cx="13" cy="13" r="2.1" fill="#fff"/></svg>Clipper <span id="ver" title="version · build time">v1.10</span></div>
  <input id="name" type="text" value="my movie" style="border:1px solid transparent;border-radius:8px;padding:5px 6px;font-weight:600;background:transparent;font-size:14px">
  <input id="pick" type="file" accept="video/*,video/quicktime,.mov,.mp4,.m4v" multiple style="display:none">
  <button class="btn" id="savelast" style="display:none">⬆ Save last movie</button>
  <button class="btn primary" id="export">Export</button>
</div>
<div id="status"></div>
<div id="tip"><span>Tip: tap <b>Share → Add to Home Screen</b> for a full-screen app without Safari's bars.</span><button id="tip-x">✕</button></div>
<div id="stagewrap">
  <div id="frame">
    <div id="stagelbl"></div>
    <img id="blurbg" alt="">
    <video id="vA" playsinline preload="auto"></video>
    <video id="vB" playsinline preload="auto"></video>
    <canvas id="ov"></canvas>
    <div id="empty"><div><b>No clips yet.</b><br><br><label class="btn primary" for="pick" style="display:inline-block;font-size:16px;padding:12px 20px">＋ Add clips from Photos</label><br><br>Everything stays on this phone.</div></div>
  </div>
</div>
<div id="transport">
  <button id="tostart">⏮</button><button id="prevf">‹</button><button id="play">▶</button><button id="nextf">›</button>
  <span class="tc"><b id="tc">0:00.0</b> / <span id="tot">0:00.0</span></span>
  <span class="spacer"></span>
  <button id="undo" title="Undo">↶</button>
</div>
<div id="tools">
  <button class="btn" id="split">✂ Split</button><button class="btn" id="setin">[ In</button><button class="btn" id="setout">Out ]</button>
  <button class="btn" id="addtext">T Text</button><button class="btn" id="movel">◀</button><button class="btn" id="mover">▶</button><button class="btn" id="sortdate" title="Order all clips by when they were shot">⇅ By date</button><button class="btn danger" id="remove">Remove</button>
</div>
<div id="tlwrap"><div id="tl"><div id="track"></div><div id="ph"></div></div></div>
<div id="trrow"><span class="lab">Between clips</span><span id="trchips"></span></div>
<div id="sheet">
  <div id="tabs"><button data-tab="clip" class="active">Clip</button><button data-tab="text">Text</button><button data-tab="movie">Movie</button></div>
  <div id="panes"><div class="pane active" id="pane-clip"></div><div class="pane" id="pane-text"></div><div class="pane" id="pane-movie"></div></div>
</div>
<div class="mbg" id="exportbg"><div class="modal" id="exportmodal"></div></div>
<div id="toast"></div>
<audio id="music" preload="auto" style="display:none"></audio>
