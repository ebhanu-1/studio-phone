<style>
  :root { --bg:#f4f5f7; --panel:#fff; --line:#e3e6eb; --line2:#d5dae2; --text:#1b2330; --muted:#67717f; --faint:#9aa3b0;
          --accent:#2563eb; --accent-soft:#eaf0fe; --stage:#0f1115; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body { font:15px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; touch-action:manipulation; padding-top:var(--sat);
         position:fixed; inset:0; width:100%; height:100vh; height:100dvh; overflow:hidden; }
  #tip { display:none; margin:0; padding:8px 12px; background:#fffbeb; color:#92400e; font-size:12.5px; border-bottom:1px solid #fde68a; align-items:center; gap:8px; }
  #tip.on { display:flex; } #tip b { font-weight:700; } #tip button { margin-left:auto; border:0; background:transparent; font-weight:700; color:#92400e; min-height:32px; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .btn { padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); font-weight:600; font-size:14px; white-space:nowrap; min-height:44px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.ghost { border-color:transparent; background:transparent; }
  .btn.danger { color:#dc2626; border-color:#f1c5c5; }
  .btn.big { font-size:17px; padding:14px 20px; min-height:52px; border-radius:14px; }
  .btn.wide { width:100%; }
  .btn:disabled { opacity:.4; }
  /* top bar: ‹ Projects · title · undo · redo · Export */
  #top { height:50px; flex:0 0 auto; display:flex; align-items:center; gap:4px; padding:0 6px 0 2px; background:var(--panel); border-bottom:1px solid var(--line); }
  #top .btn { padding:8px 10px; flex:0 0 auto; }
  #back { font-weight:700; color:var(--accent); font-size:15px; padding-left:8px; }
  #back b { font-size:20px; margin-right:2px; line-height:1; }
  #name { flex:1 1 40px; min-width:40px; border:1px solid transparent; border-radius:8px; padding:6px 6px; font-weight:700; background:transparent; font-size:15px; text-align:center; text-overflow:ellipsis; min-height:40px; }
  #name:focus { border-color:var(--line2); background:#fff; outline:none; text-align:left; }
  #ver { font-size:10px; font-weight:600; color:var(--faint); letter-spacing:.02em; flex:0 0 auto; }
  #undo, #redo { font-size:20px; padding:8px 4px; min-width:36px; }
  @media (max-width: 430px) { #ver { display:none; } #back span { display:none; } #back { padding:8px 10px 8px 10px; } #name { text-align:left; } }
  #status { display:none; padding:6px 12px; background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600; border-bottom:1px solid var(--line); }
  #status.on { display:block; }
  #missing { display:none; padding:8px 12px; background:#fffbeb; color:#92400e; font-size:13px; font-weight:600; border-bottom:1px solid #fde68a; align-items:center; gap:10px; }
  #missing.on { display:flex; } #missing span { flex:1; } #missing .btn { min-height:36px; padding:6px 12px; font-size:13px; }
  #stagelbl { position:absolute; left:8px; top:8px; z-index:3; font-size:11px; font-weight:700; color:#fff; background:rgba(0,0,0,.55); padding:4px 8px; border-radius:7px; pointer-events:none; max-width:70%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* stage */
  #stagewrap { flex:0 0 auto; background:var(--stage); position:relative; display:flex; align-items:center; justify-content:center; touch-action:none; }
  #frame { position:relative; background:#000; overflow:hidden; touch-action:none; }
  #frame video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:none; pointer-events:none; }
  #frame video.on { display:block; }
  #frame #blurbg { position:absolute; inset:-8%; width:116%; height:116%; object-fit:cover; filter:blur(18px) brightness(.8); display:none; pointer-events:none; }
  #frame #blurbg.on { display:block; }
  #ov { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#9aa3b0; padding:20px; font-size:14px; }
  #empty b { color:#cdd3dc; }
  #empty.off { display:none; }
  /* scrub bar under the picture */
